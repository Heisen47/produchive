name: Build/Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Extract the version from the git tag (e.g. v2.0.4 → 2.0.4)
      # and write it into package.json so the built artifacts and
      # app.getVersion() always match the release tag.
      - name: Sync version from git tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "Release version: $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "package.json version is now: $(node -p "require('./package.json').version")"

      - name: Install Dependencies
        run: npm install

      # Linux-specific dependencies for rpm/deb makers if needed.
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build and Make
        run: npm run make

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: out/make

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: package-macos-latest
          path: out/make

      - name: Download Ubuntu artifacts
        uses: actions/download-artifact@v4
        with:
          name: package-ubuntu-latest
          path: out/make

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: package-windows-latest
          path: out/make

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            out/make/**/*.deb
            out/make/**/*.rpm
            out/make/**/*.zip
            out/make/**/*.nupkg
            out/make/**/*.dmg
            out/make/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

