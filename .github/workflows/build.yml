name: Build/Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Extract the version from the git tag (e.g. v2.0.4 → 2.0.4)
      # and write it into package.json so the built artifacts and
      # app.getVersion() always match the release tag.
      - name: Sync version from git tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "Release version: $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "package.json version is now: $(node -p "require('./package.json').version")"

      - name: Install Dependencies
        run: npm install

      # Linux-specific dependencies for rpm/deb makers if needed (usually handled by actions/setup-node or pre-installed, but harmless to add if specific libs are missing. For now standard ubuntu-latest is usually fine for basic Electron apps)
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build and Make
        run: npm run make

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # Check the out directory for the artifacts. 
          # Forge usually outputs to "out/make/..."
          files: |
            out/make/**/*.deb
            out/make/**/*.rpm
            out/make/**/*.zip
            out/make/**/*.nupkg
            out/make/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

