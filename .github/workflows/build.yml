name: Build/Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Extract the version from the git tag (e.g. v2.0.4 → 2.0.4)
      # and write it into package.json so the built artifacts and
      # app.getVersion() always match the release tag.
      - name: Sync version from git tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "Release version: $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "package.json version is now: $(node -p "require('./package.json').version")"

      - name: Install Dependencies
        run: npm install

      # ─── Windows: install WiX Toolset v3 for MSI builder ─────────────────
      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $wixUrl = 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip'
          $zipPath = Join-Path $env:TEMP 'wix314-binaries.zip'
          $extractPath = Join-Path $env:GITHUB_WORKSPACE '.wix'
          Invoke-WebRequest -Uri $wixUrl -OutFile $zipPath -UseBasicParsing
          New-Item -ItemType Directory -Path $extractPath -Force | Out-Null
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          Remove-Item $zipPath
          Write-Host "WiX extracted to $extractPath"
          # Verify binaries exist
          if (Test-Path (Join-Path $extractPath 'candle.exe')) {
            Write-Host 'OK: candle.exe found'
          } else {
            Write-Error 'FAIL: candle.exe not found!'
          }

      - name: Build and Make
        run: npm run make

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            out/make/**/*.msi
            out/make/**/*.dmg
            out/make/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
