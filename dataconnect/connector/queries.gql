# Get all rooms (for lobby)
query ListRooms @auth(level: PUBLIC) @refresh(every: { seconds: 10 }) {
  rooms(orderBy: [{ createdAt: DESC }], limit: 50) {
    id
    name
    environment
    maxLimit
    host { displayName }
    participantCount: roomParticipants_on_room {
      user { uid }
    }
  }
}

# Get a specific room's state
query GetRoomState($roomId: UUID!) @auth(level: USER) 
  @refresh(every: { seconds: 10 }) 
  @refresh(onMutationExecuted: {
    operation: "JoinRoom",
    condition: "mutation.variables.roomId == request.variables.roomId"
  })
  @refresh(onMutationExecuted: {
    operation: "LeaveRoom",
    condition: "mutation.variables.roomId == request.variables.roomId"
  })
  @refresh(onMutationExecuted: {
    operation: "UpdateActiveDuration",
    condition: "mutation.variables.roomId == request.variables.roomId"
  })
{
  room(id: $roomId) {
    id
    name
    environment
    maxLimit
    host { uid displayName }
    participants: roomParticipants_on_room(orderBy: [{ activeDurationSeconds: DESC }]) {
      user { uid displayName }
      activeDurationSeconds
      joinedAt
    }
  }
}
